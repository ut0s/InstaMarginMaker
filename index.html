<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta Margin Maker - Instagram向け 画像余白追加ツール</title>
    <meta name="description" content="Instagramの投稿（1:1、4:5）に合わせて画像の余白を追加・調整できるWebツールです。">
    <!-- OGP tags for social sharing -->
    <meta property="og:title" content="Insta Margin Maker - Instagram向け 画像余白追加ツール">
    <meta property="og:description" content="Instagramの投稿に合わせて画像の余白を追加・調整できるWebツールです。">
    <meta property="og:type" content="website">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* キャンバスのプレビュー用スタイル。実際の解像度は保ちつつ表示サイズを調整 */
        #preview-canvas {
            max-width: 100%;
            max-height: 60vh;
            object-fit: contain;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAAXNSR0IArs4c6QAAADFJREFUOE9jZGBgEGHAA/7//2/AwMAwkYjM+A+kEQ0Nwy4M2jEQDcbRMGgHCA1QdAkA7R89Et5i2u4AAAAASUVORK5CYII='); /* 透明背景を示す市松模様 */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-gray-800">

    <header class="bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-md py-4">
        <div class="container mx-auto px-4 flex items-center justify-between">
            <h1 class="text-2xl font-bold"><i class="fab fa-instagram mr-2"></i>Insta Margin Maker</h1>
            <a href="https://github.com/ut0s/InstaMarginMaker" target="_blank" rel="noopener noreferrer" class="text-white hover:text-gray-200 transition-colors text-xl" title="GitHub Repository">
                <i class="fab fa-github"></i>
            </a>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 flex flex-col lg:flex-row gap-8">
        
        <!-- 左側：設定パネル -->
        <div class="w-full lg:w-1/3 space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-semibold mb-4 border-b pb-2"><i class="fas fa-sliders-h mr-2"></i>設定</h2>
                
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">1. 画像をアップロード</label>
                    <input type="file" id="image-upload" accept="image/*" class="block w-full text-sm text-gray-500
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-full file:border-0
                        file:text-sm file:font-semibold
                        file:bg-purple-50 file:text-purple-700
                        hover:file:bg-purple-100 cursor-pointer
                    "/>
                </div>

                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">2. アスペクト比 (比率)</label>
                    <div class="flex gap-4">
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="aspect-ratio" value="1:1" checked class="w-4 h-4 text-purple-600 border-gray-300 focus:ring-purple-500">
                            <span class="ml-2 text-sm text-gray-700">1:1 (正方形)</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="aspect-ratio" value="4:5" class="w-4 h-4 text-purple-600 border-gray-300 focus:ring-purple-500">
                            <span class="ml-2 text-sm text-gray-700">4:5 (縦長)</span>
                        </label>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">3. 背景色</label>
                    <div class="flex flex-wrap gap-4 mb-3">
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="bg-color" value="#ffffff" checked class="w-4 h-4 text-purple-600 border-gray-300 focus:ring-purple-500">
                            <span class="ml-2 text-sm text-gray-700">ホワイト</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="bg-color" value="#000000" class="w-4 h-4 text-purple-600 border-gray-300 focus:ring-purple-500">
                            <span class="ml-2 text-sm text-gray-700">ブラック</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="bg-color" value="custom" class="w-4 h-4 text-purple-600 border-gray-300 focus:ring-purple-500">
                            <span class="ml-2 text-sm text-gray-700">カスタム</span>
                        </label>
                    </div>
                    
                    <!-- カスタムカラー用ツール（カスタム選択時に表示） -->
                    <div id="custom-color-tools" class="hidden flex flex-col gap-2 bg-gray-50 p-3 rounded-lg border border-gray-200">
                        <div class="flex items-center gap-3">
                            <input type="color" id="custom-color-input" value="#f472b6" class="w-8 h-8 rounded cursor-pointer border-0 p-0" title="カラーピッカーを開く">
                            <button id="eyedropper-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded text-sm transition flex items-center gap-2">
                                <i class="fas fa-eye-dropper"></i> 画像から色を取得
                            </button>
                        </div>
                        <span id="eyedropper-fallback-msg" class="hidden text-xs text-gray-500">
                            <i class="fas fa-info-circle"></i> 画像上をクリックして色を取得できます（スポイト未対応ブラウザ用）
                        </span>
                    </div>
                </div>

                <button id="download-btn" disabled class="w-full bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                    <i class="fas fa-download"></i> 画像をダウンロード
                </button>
            </div>
            
            <div class="bg-blue-50 p-4 rounded-xl text-sm text-blue-800">
                <p><i class="fas fa-info-circle mr-1"></i>ヒント: Instagramの推奨アスペクト比（1:1 や 4:5）を意識して余白を調整すると、きれいに投稿できます。</p>
            </div>
        </div>

        <!-- 右側：プレビュー領域 -->
        <div class="w-full lg:w-2/3 bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center p-6 min-h-[400px]">
            <div id="placeholder" class="text-gray-400 flex flex-col items-center">
                <i class="far fa-image text-6xl mb-4 text-gray-300"></i>
                <p>画像をアップロードするとここにプレビューが表示されます</p>
            </div>
            <canvas id="preview-canvas" class="hidden rounded"></canvas>
            <p id="canvas-info" class="hidden mt-4 text-sm text-gray-500 font-mono"></p>
        </div>

    </main>

    <footer class="bg-gray-800 text-gray-300 py-6 text-center text-sm">
        <p>&copy; 2026 Insta Margin Maker. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const imageUpload = document.getElementById('image-upload');
            const aspectRadios = document.querySelectorAll('input[name="aspect-ratio"]');
            const colorRadios = document.querySelectorAll('input[name="bg-color"]');
            const canvas = document.getElementById('preview-canvas');
            const ctx = canvas.getContext('2d');
            const placeholder = document.getElementById('placeholder');
            const downloadBtn = document.getElementById('download-btn');
            const canvasInfo = document.getElementById('canvas-info');

            const customColorTools = document.getElementById('custom-color-tools');
            const customColorInput = document.getElementById('custom-color-input');
            const eyedropperBtn = document.getElementById('eyedropper-btn');
            const eyedropperFallbackMsg = document.getElementById('eyedropper-fallback-msg');
            const customRadio = document.querySelector('input[value="custom"]');

            let currentImage = null;

            // ツール表示の更新
            function updateColorToolsVisibility() {
                if (document.querySelector('input[name="bg-color"]:checked').value === 'custom') {
                    customColorTools.classList.remove('hidden');
                    if (!window.EyeDropper) canvas.style.cursor = 'crosshair';
                } else {
                    customColorTools.classList.add('hidden');
                    canvas.style.cursor = 'default';
                }
            }

            // アスペクト比と背景色の変更イベント
            aspectRadios.forEach(radio => radio.addEventListener('change', drawCanvas));
            
            colorRadios.forEach(radio => {
                radio.addEventListener('change', () => {
                    updateColorToolsVisibility();
                    drawCanvas();
                });
            });

            customColorInput.addEventListener('input', drawCanvas);

            // スポイトAPI (EyeDropper API) のセットアップ
            if (!window.EyeDropper) {
                // サポートされていない場合はボタンを隠してフォールバックメッセージを表示
                eyedropperBtn.classList.add('hidden');
                eyedropperFallbackMsg.classList.remove('hidden');
            } else {
                eyedropperBtn.addEventListener('click', async () => {
                    const eyeDropper = new EyeDropper();
                    try {
                        const result = await eyeDropper.open();
                        customColorInput.value = result.sRGBHex;
                        customRadio.checked = true; // カスタムラジオボタンを選択状態にする
                        updateColorToolsVisibility();
                        drawCanvas();
                    } catch (e) {
                        console.log('EyeDropper canceled or failed', e);
                    }
                });
            }

            // フォールバック: キャンバス上のクリックで色を直接取得（EyeDropper非対応ブラウザ用）
            function rgbToHex(r, g, b) {
                return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1);
            }

            canvas.addEventListener('click', (e) => {
                if (!document.querySelector('input[value="custom"]').checked || !currentImage) return;

                // object-fit: contain における実際の描画位置を計算
                const rect = canvas.getBoundingClientRect();
                const canvasRatio = canvas.width / canvas.height;
                const elementRatio = rect.width / rect.height;
                
                let renderedWidth, renderedHeight, offsetX = 0, offsetY = 0;
                
                if (canvasRatio > elementRatio) {
                    renderedWidth = rect.width;
                    renderedHeight = rect.width / canvasRatio;
                    offsetY = (rect.height - renderedHeight) / 2;
                } else {
                    renderedHeight = rect.height;
                    renderedWidth = rect.height * canvasRatio;
                    offsetX = (rect.width - renderedWidth) / 2;
                }
                
                const clickX = e.clientX - rect.left - offsetX;
                const clickY = e.clientY - rect.top - offsetY;

                // 描画領域内をクリックしたか判定
                if (clickX >= 0 && clickX <= renderedWidth && clickY >= 0 && clickY <= renderedHeight) {
                    const scaleX = canvas.width / renderedWidth;
                    const scaleY = canvas.height / renderedHeight;
                    const actualX = Math.floor(clickX * scaleX);
                    const actualY = Math.floor(clickY * scaleY);

                    try {
                        const pixel = ctx.getImageData(actualX, actualY, 1, 1).data;
                        const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);
                        customColorInput.value = hex;
                        drawCanvas();
                    } catch (error) {
                        console.warn("画像ピクセルデータの取得に失敗しました", error);
                    }
                }
            });

            // 画像アップロードのイベント
            imageUpload.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        currentImage = img;
                        placeholder.classList.add('hidden');
                        canvas.classList.remove('hidden');
                        canvasInfo.classList.remove('hidden');
                        downloadBtn.disabled = false;
                        drawCanvas();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            // キャンバス描画処理
            function drawCanvas() {
                if (!currentImage) return;

                const aspectValue = document.querySelector('input[name="aspect-ratio"]:checked').value;
                const bgOption = document.querySelector('input[name="bg-color"]:checked').value;
                
                // カスタム背景色が選択されている場合は、カラーピッカーの値を適用
                const bgColor = bgOption === 'custom' ? customColorInput.value : bgOption;

                let targetRatio = 1; // 1:1
                if (aspectValue === '4:5') {
                    targetRatio = 4 / 5;
                }

                const imgWidth = currentImage.width;
                const imgHeight = currentImage.height;
                const imgRatio = imgWidth / imgHeight;

                let newWidth, newHeight;

                if (imgRatio > targetRatio) {
                    // 画像の方が横長 -> 幅を基準に高さを拡張して余白を作る
                    newWidth = imgWidth;
                    newHeight = imgWidth / targetRatio;
                } else {
                    // 画像の方が縦長 -> 高さを基準に幅を拡張して余白を作る
                    newHeight = imgHeight;
                    newWidth = imgHeight * targetRatio;
                }

                // キャンバスの実解像度を設定
                canvas.width = newWidth;
                canvas.height = newHeight;

                // 背景を描画
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, newWidth, newHeight);

                // 画像を中央に配置するためのオフセット計算
                const offsetX = (newWidth - imgWidth) / 2;
                const offsetY = (newHeight - imgHeight) / 2;
                
                // 画像を描画
                ctx.drawImage(currentImage, offsetX, offsetY, imgWidth, imgHeight);

                // サイズ情報を更新
                canvasInfo.innerHTML = `Output Size: <b>${Math.round(newWidth)}</b> x <b>${Math.round(newHeight)}</b> px`;
            }

            // ダウンロード処理
            downloadBtn.addEventListener('click', () => {
                if (!currentImage) return;
                
                // キャンバスの内容をDataURLとして取得
                const dataUrl = canvas.toDataURL('image/png');
                
                // ダウンロード用のリンクを作成してクリック
                const link = document.createElement('a');
                link.download = `instagram-margin-${Date.now()}.png`;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        });
    </script>
</body>
</html>
